services:
  kernel:
    build: .
    ports:
      - "${VAOS_HTTP_PORT:-8080}:8080"
      - "${VAOS_GRPC_PORT:-50051}:50051"
    environment:
      - VAOS_KERNEL_MODE=sync
      - AMQP_URL=amqp://${VAOS_RABBITMQ_USER:-vaos}:${VAOS_RABBITMQ_PASSWORD:-vaos}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      retries: 3

  kernel-with-db:
    build: .
    ports:
      - "${VAOS_DB_HTTP_PORT:-8081}:8080"
      - "${VAOS_DB_GRPC_PORT:-50052}:50051"
    environment:
      - VAOS_KERNEL_MODE=db-sync
      - VAOS_DB_DSN=host=postgres user=vaos password=vaos dbname=vaos_kernel sslmode=disable
      - VAOS_DB_HOST=postgres
      - VAOS_DB_USER=vaos
      - VAOS_DB_PASSWORD=vaos
      - VAOS_DB_NAME=vaos_kernel
      - AMQP_URL=amqp://${VAOS_RABBITMQ_USER:-vaos}:${VAOS_RABBITMQ_PASSWORD:-vaos}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kernel-db-async:
    profiles: ["db-async"]
    build: .
    ports:
      - "${VAOS_ASYNC_DB_HTTP_PORT:-8082}:8080"
      - "${VAOS_ASYNC_DB_GRPC_PORT:-50053}:50051"
    environment:
      - VAOS_KERNEL_MODE=db-async
      - VAOS_DB_DSN=host=postgres user=vaos password=vaos dbname=vaos_kernel sslmode=disable
      - VAOS_DB_HOST=postgres
      - VAOS_DB_USER=vaos
      - VAOS_DB_PASSWORD=vaos
      - VAOS_DB_NAME=vaos_kernel
      - AMQP_URL=amqp://${VAOS_RABBITMQ_USER:-vaos}:${VAOS_RABBITMQ_PASSWORD:-vaos}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vaos
      POSTGRES_PASSWORD: vaos
      POSTGRES_DB: vaos_kernel
    ports:
      - "${VAOS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/001-vaos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaos"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${VAOS_RABBITMQ_USER:-vaos}
      RABBITMQ_DEFAULT_PASS: ${VAOS_RABBITMQ_PASSWORD:-vaos}
    ports:
      - "${VAOS_AMQP_PORT:-5672}:5672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  rabbitdata:
